- name: "识神"
  protocol_name: "Ego"
  type: "进程集合"
  description: "由自洽维稳机制（Process.EgoStabilizer）主导、夹杂本能冲动与部分理性碎片的混乱进程集合。"
- name: "识神（干扰器）"
  protocol_name: "Ego.Firewall_Jammer"
  type: "干扰模块"
  description: "充满病毒和垃圾广告的浏览器，不断弹窗占用带宽，阻断元神连接。"
- name: "伪平衡"
  protocol_name: "Balance.False"
  type: "系统状态"
  description: "扭曲或筛选外部信息以维护既有错误认知框架的‘认知舒适区’策略。"
- name: "自洽维稳机制"
  protocol_name: "Process.EgoStabilizer"
  type: "软件进程"
  description: "核心目标是维持‘自我’这个故事的连贯性与认知框架的自洽。"
- name: "本能"
  protocol_name: "Process.Instinct"
  type: "软件进程"
  description: "最底层的驱动力，负责生存、繁衍、能量节省。"
- name: "理性"
  protocol_name: "Process.Reason"
  type: "软件进程"
  description: "负责分析现实、计算利弊、规划未来，追求客观最优解。"
